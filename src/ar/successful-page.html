<!DOCTYPE html>

    <meta charset="UTF-8" />

    <style>
      :root {
        --color-primary-text-color: #1cb280;
        --color-alternate-text-color: #839992;
        --color-active-color: #f64148;
      }

      body {
        background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
      }

      .success-animation {
        animation: successScale 0.6s ease-out forwards;
        opacity: 0;
      }

      @keyframes successScale {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        70% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        opacity: 0;
      }

      .checkmark-circle {
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
      }

      .checkmark {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: block;
        stroke-width: 2;
        stroke: #fff;
        stroke-miterlimit: 10;
        margin: 10% auto;
        animation: fill 0.4s ease-in-out 0.4s forwards,
          scale 0.3s ease-in-out 0.9s both;
      }

      .checkmark-check {
        transform-origin: 50% 50%;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
      }

      @keyframes stroke {
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes scale {
        0%,
        100% {
          transform: none;
        }
        50% {
          transform: scale3d(1.1, 1.1, 1);
        }
      }

      @keyframes fill {
        100% {
          box-shadow: inset 0px 0px 0px 60px #1cb280;
        }
      }

      .pulse-animation {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(28, 178, 128, 0.4);
        }
        70% {
          box-shadow: 0 0 0 20px rgba(28, 178, 128, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(28, 178, 128, 0);
        }
      }

      .fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
        opacity: 0;
      }

      .fade-in-up-delay {
        animation: fadeInUp 0.8s ease-out 0.3s forwards;
        opacity: 0;
      }

      .fade-in-up-delay-2 {
        animation: fadeInUp 0.8s ease-out 0.6s forwards;
        opacity: 0;
      }

      @keyframes fadeInUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .floating {
        animation: floating 3s ease-in-out infinite;
      }

      @keyframes floating {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-15px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      .confetti-animation {
        animation: confettiRain 5s infinite;
      }

      @keyframes confettiRain {
        0% {
          opacity: 1;
          margin-top: -100px;
        }
        100% {
          opacity: 0;
          margin-top: 1000px;
        }
      }
    </style>

    <script>
      // Create confetti animation
      document.addEventListener("DOMContentLoaded", function () {
        const confettiContainer = document.getElementById("confetti-container");
        const colors = ["#1cb280", "#f64148", "#839992", "#0d8a63", "#ffc107"];

        // Create confetti elements
        for (let i = 0; i < 80; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti confetti-animation";
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          confetti.style.width = Math.random() * 10 + 5 + "px";
          confetti.style.height = Math.random() * 10 + 5 + "px";
          confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
          confetti.style.animationDelay = Math.random() * 5 + "s";
          confetti.style.animationDuration = Math.random() * 3 + 3 + "s";
          confettiContainer.appendChild(confetti);
        }

        // Add success sound effect simulation
        const successSound = () => {
          // In a real implementation, you would play an audio file
          console.log("Success sound played!");
        };

        // Trigger animations on page load
        setTimeout(successSound, 300);

        // Add hover effect to main card
        const mainCard = document.querySelector(".max-w-4xl");
        mainCard.addEventListener("mouseenter", function () {
          this.style.transform = "translateY(-5px)";
          this.style.transition = "transform 0.3s ease";
        });

        mainCard.addEventListener("mouseleave", function () {
          this.style.transform = "translateY(0)";
        });
      });
      document.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const inputId = btn.dataset.target;
          const input = document.getElementById(inputId);
          console.log(input);

          navigator.clipboard.writeText(input.value).then(() => {
            const cashedBtnInner = btn.innerHTML;
            btn.innerHTML = `<svg class="fill-primary-text-color" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 640 640">
                                <path d="M320 576C178.6 576 64 461.4 64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576zM438 209.7C427.3 201.9 412.3 204.3 404.5 215L285.1 379.2L233 327.1C223.6 317.7 208.4 317.7 199.1 327.1C189.8 336.5 189.7 351.7 199.1 361L271.1 433C276.1 438 282.9 440.5 289.9 440C296.9 439.5 303.3 435.9 307.4 430.2L443.3 243.2C451.1 232.5 448.7 217.5 438 209.7z"></path>
                            </svg>`;
            setTimeout(() => {
              btn.innerHTML = cashedBtnInner;
            }, 1000);
          });
        });
      });
